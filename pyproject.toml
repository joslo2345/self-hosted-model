[project]
name = "self-hosted-model"
version = "0.1.0"
description = "Self-hosted open model serving for the GPU-fleet incident assistant (Project A)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["openai>=1.50", "httpx>=0.27"]

[project.scripts]
selfhost = "selfhost.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selfhost"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
