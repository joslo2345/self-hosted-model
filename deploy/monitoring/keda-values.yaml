# B3: KEDA (kedacore/keda) with smaller requests for the kind node; defaults otherwise.
resources:
  operator:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 512Mi }
  metricServer:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 512Mi }
  webhooks:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 256Mi }
