# B3: Grafana for the kind test (grafana/grafana). Same datasource uid as Project A's Grafana, so
# deploy/monitoring/dashboards/vllm-serving.json loads unchanged next to its fleet and system
# dashboards. Reached only through `kubectl port-forward` on 127.0.0.1.
persistence: { enabled: false }
testFramework: { enabled: false }
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc
        isDefault: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: self-hosted-model
        folder: Self-hosted model
        type: file
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/self-hosted-model

# ConfigMap made from deploy/monitoring/dashboards by make monitoring-up.
dashboardsConfigMaps:
  self-hosted-model: vllm-dashboards

grafana.ini:
  analytics: { reporting_enabled: false, check_for_updates: false }
  auth.anonymous: { enabled: false }
