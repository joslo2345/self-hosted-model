{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "vllm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "vllm.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: http }]
      from: {{- toYaml .Values.networkPolicy.from | nindent 8 }}
{{- end }}
